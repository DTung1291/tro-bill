name: Production health monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  readiness-check:
    if: vars.PRODUCTION_HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: production-health-monitor
      cancel-in-progress: true
    steps:
      - name: Checkout alert helper
        uses: actions/checkout@v7

      - name: Check API and database readiness
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: >-
          curl --fail --silent --show-error
          --connect-timeout 10 --max-time 20
          --retry 1 --retry-delay 5
          "$PRODUCTION_HEALTH_URL/api/health/ready"

      - name: Report production health failure
        if: failure()
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          ALERT_MESSAGE: TrọBill production readiness check failed in GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/send-ops-alert.js

      - name: Open production incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_ISSUE_TITLE: OPS production health check failed
          OPS_ISSUE_BODY: Production API hoặc database readiness đang thất bại. Issue này chỉ được tạo một lần và sẽ tự đóng khi hệ thống phục hồi.
          OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/manage-operations-issue.sh open

      - name: Close production incident after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_ISSUE_TITLE: OPS production health check failed
          OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/manage-operations-issue.sh close
